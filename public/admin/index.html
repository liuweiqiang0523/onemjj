<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneMJJ 后台管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:1180px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand h1{margin:0;font-size:34px;letter-spacing:-1px}.brand p{margin:6px 0 0;color:#667085}.card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(20,30,60,.08)}input,textarea,select{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:11px 12px;font:inherit;background:white}textarea{min-height:88px;resize:vertical}label{font-size:13px;color:#475467;display:grid;gap:7px}button{border:0;border-radius:999px;padding:11px 15px;font:inherit;cursor:pointer;background:#111827;color:white}.ghost{background:#f2f4f7;color:#111827}.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{background:#eef2ff;color:#3730a3}.tab.active{background:#111827;color:white}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #edf0f5;border-radius:16px;padding:12px}.row b{display:block}.row small{color:#667085}.form{display:grid;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.status{padding:10px 12px;border-radius:12px;background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.split{display:grid;grid-template-columns:360px 1fr;gap:16px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:850px){.split,.grid{grid-template-columns:1fr}header{display:block}.top-actions{margin-top:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><h1>OneMJJ 后台</h1><p>登录后自己增删改首页工具、脚本和小报内容。</p></div>
      <div class="top-actions"><a href="/" class="ghost" style="text-decoration:none;padding:11px 15px;border-radius:999px">返回前台</a><button id="saveBtn">保存发布</button></div>
    </header>
    <section id="login" class="card">
      <h2>登录</h2>
      <div class="grid"><label>管理密码<input id="password" type="password" placeholder="输入管理密码" /></label><label>&nbsp;<button id="loginBtn">登录</button></label></div>
      <p id="loginMsg"></p>
    </section>
    <section id="admin" class="hidden">
      <div class="tabs"><button class="tab active" data-tab="tools">工具卡片</button><button class="tab" data-tab="scripts">脚本速查</button><button class="tab" data-tab="notes">小报/Wiki</button><button class="tab" data-tab="json">高级 JSON</button></div>
      <p id="msg"></p>
      <div id="toolsPanel" class="split"><div class="card"><h2>工具列表</h2><div id="toolList" class="list"></div><div class="actions"><button id="newTool">新增工具</button></div></div><div class="card"><h2>编辑工具</h2><div class="form" id="toolForm"></div></div></div>
      <div id="scriptsPanel" class="card hidden"><h2>脚本速查</h2><div id="scriptList" class="list"></div><div class="actions"><button id="newScript">新增脚本</button></div></div>
      <div id="notesPanel" class="card hidden"><h2>小报 / Wiki 卡片</h2><div id="noteList" class="list"></div><div class="actions"><button id="newNote">新增卡片</button></div></div>
      <div id="jsonPanel" class="card hidden"><h2>高级 JSON</h2><p>如果表单不够用，可以直接编辑完整 JSON。保存前会校验。</p><textarea id="jsonEdit" class="mono" style="min-height:520px"></textarea></div>
    </section>
  </div>
<script>
let data=null, password='', currentTool=0;
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
function msg(t,err=false){$('#msg').textContent=t; $('#msg').className=t?(err?'status err':'status'):''}
function loginMsg(t,err=false){$('#loginMsg').textContent=t; $('#loginMsg').className=t?(err?'status err':'status'):''}
async function api(action, payload={}){const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password,action,...payload})}); const j=await r.json().catch(()=>({ok:false,error:'BAD_RESPONSE'})); if(!r.ok||!j.ok) throw new Error(j.error||'请求失败'); return j;}
async function load(){const r=await fetch('/api/data',{cache:'no-store'}); data=await r.json(); $('#jsonEdit').value=JSON.stringify(data,null,2); renderAll();}
function showAdmin(){ $('#login').classList.add('hidden'); $('#admin').classList.remove('hidden'); }
async function doLogin(){password=$('#password').value||password; try{await api('login'); localStorage.setItem('onemjj_admin_password',password); showAdmin(); await load();}catch(e){loginMsg('密码不对或后台未配置：'+e.message,true)}}
function input(id,label,value='',type='text'){return `<label>${label}<input id="${id}" type="${type}" value="${String(value||'').replaceAll('"','&quot;')}" /></label>`}
function textarea(id,label,value=''){return `<label>${label}<textarea id="${id}">${String(value||'').replaceAll('<','&lt;')}</textarea></label>`}
function collectLines(v){return v.split('\n').map(x=>x.trim()).filter(Boolean)}
function parseLinks(v){return collectLines(v).map(line=>{const [label,url,note]=line.split('|').map(x=>x?.trim()); return {label:label||url,url:url||'#',note:note||''}})}
function linksText(arr){return (arr||[]).map(l=>`${l.label}|${l.url}|${l.note||''}`).join('\n')}
function renderTools(){const list=$('#toolList'); list.innerHTML=data.tools.map((t,i)=>`<div class="row"><div><b>${t.icon} ${t.name}</b><small>${t.category} · ${t.desc}</small></div><div><button class="ghost" onclick="editTool(${i})">编辑</button><button class="danger" onclick="delTool(${i})">删</button></div></div>`).join(''); editTool(Math.min(currentTool,data.tools.length-1));}
window.editTool=i=>{currentTool=i; const t=data.tools[i]||{}; $('#toolForm').innerHTML=`<div class="grid">${input('t_id','ID',t.id||('tool-'+Date.now()))}${input('t_icon','图标',t.icon||'🔗')}${input('t_name','名称',t.name||'')}${input('t_cat','分类',t.category||'')}${input('t_desc','短说明',t.desc||'')}${input('t_badge','角标',t.badge||'')}${input('t_private','私人入口 true/false',t.private?'true':'false')}</div>${textarea('t_body','详情说明',t.body||'')}${textarea('t_links','链接，每行：标题|URL|备注',linksText(t.links))}${textarea('t_cmds','命令，每行一条',(t.commands||[]).join('\n'))}<div class="actions"><button onclick="saveTool()">应用到列表</button></div>`}
window.saveTool=()=>{const t={id:$('#t_id').value.trim(),icon:$('#t_icon').value.trim()||'🔗',name:$('#t_name').value.trim(),category:$('#t_cat').value.trim()||'Other',desc:$('#t_desc').value.trim(),badge:$('#t_badge').value.trim()||undefined,private:$('#t_private').value.trim()==='true',body:$('#t_body').value.trim(),links:parseLinks($('#t_links').value),commands:collectLines($('#t_cmds').value)}; data.tools[currentTool]=t; syncJson(); renderTools(); msg('已应用，记得点右上角保存发布')}
window.delTool=i=>{if(confirm('删除这个工具？')){data.tools.splice(i,1); currentTool=0; syncJson(); renderTools();}}
function renderScripts(){ $('#scriptList').innerHTML=data.scripts.map((s,i)=>`<div class="row"><div><b>${s.title}</b><small class="mono">${s.cmd}</small></div><div><button class="ghost" onclick="editScript(${i})">编辑</button><button class="danger" onclick="delScript(${i})">删</button></div></div>`).join('') }
window.editScript=i=>{const s=data.scripts[i]; const title=prompt('脚本标题',s.title); if(title===null)return; const cmd=prompt('命令',s.cmd); if(cmd===null)return; data.scripts[i]={title,cmd}; syncJson(); renderScripts();}
window.delScript=i=>{if(confirm('删除脚本？')){data.scripts.splice(i,1); syncJson(); renderScripts();}}
function renderNotes(){ $('#noteList').innerHTML=data.notes.map((n,i)=>`<div class="row"><div><b>${n.tag}｜${n.title}</b><small>${n.body}</small></div><div><button class="ghost" onclick="editNote(${i})">编辑</button><button class="danger" onclick="delNote(${i})">删</button></div></div>`).join('') }
window.editNote=i=>{const n=data.notes[i]; const tag=prompt('标签',n.tag); if(tag===null)return; const title=prompt('标题',n.title); if(title===null)return; const body=prompt('内容',n.body); if(body===null)return; data.notes[i]={tag,title,body}; syncJson(); renderNotes();}
window.delNote=i=>{if(confirm('删除卡片？')){data.notes.splice(i,1); syncJson(); renderNotes();}}
function syncJson(){ $('#jsonEdit').value=JSON.stringify(data,null,2) }
function renderAll(){renderTools(); renderScripts(); renderNotes(); syncJson()}
$('#loginBtn').onclick=doLogin; $('#password').value=''; localStorage.removeItem('onemjj_admin_password');
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); ['tools','scripts','notes','json'].forEach(id=>$('#'+id+'Panel').classList.toggle('hidden',b.dataset.tab!==id));});
$('#newTool').onclick=()=>{data.tools.push({id:'tool-'+Date.now(),name:'新工具',desc:'说明',icon:'🔗',category:'Other',body:'详情说明',links:[]}); currentTool=data.tools.length-1; syncJson(); renderTools();}
$('#newScript').onclick=()=>{data.scripts.push({title:'新脚本',cmd:'echo hello'}); syncJson(); renderScripts();}
$('#newNote').onclick=()=>{data.notes.push({tag:'新标签',title:'新标题',body:'新内容'}); syncJson(); renderNotes();}
$('#saveBtn').onclick=async()=>{try{if(!data) data=JSON.parse($('#jsonEdit').value); if(!$('#jsonPanel').classList.contains('hidden')) data=JSON.parse($('#jsonEdit').value); await api('save',{data}); msg('保存成功，前台刷新即可看到新内容');}catch(e){msg('保存失败：'+e.message,true)}}
</script>
</body></html>
